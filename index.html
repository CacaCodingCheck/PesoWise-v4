<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peso Plan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peso Plan">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A0A0A;--card:#151515;--ink:#F4EEDC;--mut:#A39B85;--line:#2B2620;--acc:#E3B93C;--onacc:#1A1300;--warn:#FF9F1C;--bad:#FF5A52}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px 16px 170px}
h1,h2{margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
h1{font-size:1.4rem}h2{font-size:1.05rem}
small,.mut{color:var(--mut)}
.card,.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{padding:22px 18px}
.lbl{color:var(--mut);font-size:.9rem}
.big{font-size:clamp(2.4rem,12vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:var(--warn)}.bar.strong i{background:#E8741E}.bar.bad i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--mut);flex-wrap:wrap}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:.92rem;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink);border:1px solid var(--warn)}
.banner.strong{border-color:#E8741E}.banner.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.wallets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.wallets .card{margin:0;border-top:5px solid var(--c)}
.wallets b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;word-break:break-word}
.wallets small{display:block}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
.sec h2{margin:0}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
.em{font-size:1.5rem;width:40px;height:40px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.tm{flex:1;min-width:0}.tm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:4px}
label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--mut)}
label input,label select{color:var(--ink)}
button{cursor:pointer}
.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:var(--onacc);font-weight:800;font-size:1rem}
.danger{width:100%;padding:12px;margin-top:8px;border:1px solid var(--bad);border-radius:14px;background:none;color:var(--bad);font-weight:600}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:8px}
.err{color:var(--bad);font-size:.9rem;margin:0 0 10px;min-height:0}
.err.w{color:var(--ink);background:color-mix(in srgb,var(--warn) 18%,transparent);border:1px solid var(--warn);border-radius:12px;padding:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters{margin-bottom:12px}.filters>*{margin-bottom:8px}
.cb{margin-bottom:12px}.cb .row{color:var(--ink);margin-bottom:4px}
.cb .bar{height:10px;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mut);font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:14px 22px;border:0;border-radius:99px;background:var(--acc);color:var(--onacc);font-weight:800;font-size:1rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:relative;width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.src{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sb{flex:1;min-width:110px;padding:16px 8px;border:2px solid var(--line);border-radius:14px;background:none;font-weight:800;font-size:1rem}
.sb.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.wr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
svg{max-width:100%;height:auto;display:block}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pos{color:var(--acc)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.safe{margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--acc) 14%,transparent)}
.safe b{font-size:1.8rem;display:block;letter-spacing:-.02em}
#menu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5;width:220px}
#menu[hidden]{display:none}
#menu button{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:800;text-align:left}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px}
#lock[hidden]{display:none}
nav button{font-size:.8rem}
.primary,#fab{background:linear-gradient(135deg,var(--g1),var(--g2))}
#fab{box-shadow:0 8px 28px rgba(227,185,60,.28)}
.hero{border-color:var(--heroline);background:var(--hero)}
.em{overflow:hidden}
.ci{width:100%;height:100%;object-fit:cover;display:block}
.ci.s{width:1.3em;height:1.3em;display:inline-block;vertical-align:-.3em;border-radius:6px}
.wallets .card{background:color-mix(in srgb,var(--c) 16%,var(--card))}
.wh{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.wi{width:28px;height:28px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--bg);flex:none;font-size:1.05rem}
:root{--hero:linear-gradient(160deg,#1B1912,#121212);--heroline:#3A3020}
:root[data-theme="light"]{color-scheme:light;--bg:#F7F4EC;--card:#fff;--ink:#1B1608;--mut:#7A705A;--line:#E6DEC8;--acc:#A87A00;--onacc:#1A1300;--warn:#C96F00;--bad:#C62828;--hero:linear-gradient(160deg,#FFF6DC,#fff);--heroline:#EAD9A8}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{color-scheme:light;--bg:#F7F4EC;--card:#fff;--ink:#1B1608;--mut:#7A705A;--line:#E6DEC8;--acc:#A87A00;--onacc:#1A1300;--warn:#C96F00;--bad:#C62828;--hero:linear-gradient(160deg,#FFF6DC,#fff);--heroline:#EAD9A8}}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.qb{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);text-align:left}
.qb b{display:block}.qb small{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(124px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;max-width:92%}
#toast[hidden]{display:none}#toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800}
:root{--g1:#F1D26A;--g2:#C9962B}
:root[data-accent="emerald"]{--acc:#2FD39A;--g1:#7CF0C6;--g2:#12A06F}
:root[data-accent="rose"]{--acc:#F0A6A0;--g1:#F8C9C4;--g2:#D9827B}
:root[data-accent="ocean"]{--acc:#5BB8F0;--g1:#8FD3FA;--g2:#2F8FD0}
:root[data-theme="light"][data-accent="emerald"]{--acc:#0E9B6A}
:root[data-theme="light"][data-accent="rose"]{--acc:#C2635C}
:root[data-theme="light"][data-accent="ocean"]{--acc:#1C78B5}
.card,.hero{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--acc) 28%,transparent),0 10px 28px rgba(0,0,0,.14)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.4);padding:0;overflow:hidden}
nav button.on{box-shadow:none;background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:16px;margin:4px}
#fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#menu{bottom:calc(144px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.dh{display:flex;justify-content:space-between;margin:16px 2px 6px;color:var(--mut);font-weight:600;font-size:.9rem}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.wr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
label{min-width:0}
input[type=date]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
main{padding-bottom:230px}
.card,.hero{border-radius:22px}
.lbl{text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.big{font-size:clamp(2.6rem,13vw,3.8rem)}
button:active{transform:scale(.98)}
.panel::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.64rem;padding:10px 2px}
#fab{left:auto;right:max(16px,calc(50% - 264px));transform:none;width:58px;height:58px;padding:0;border-radius:50%;display:grid;place-items:center}
#menu{left:auto;right:max(16px,calc(50% - 264px));transform:none}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:-4px 0 12px}
.eg button{border:0;background:var(--bg);border-radius:10px;padding:6px 0;font-size:1.25rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px;text-align:center}
.cd{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.78rem;position:relative}
.cd b{font-weight:600}.cd u{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.ub{display:block;background:none;border:0;padding:0;margin:2px 2px 14px;text-align:left;color:inherit}
.ub span{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.setb{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:150px;font-size:1.3rem;font-weight:600;color:var(--ink);margin-bottom:14px}
.setb i{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:1.3rem}
.addacc{border:2px dashed var(--line);border-radius:22px;background:none;display:grid;place-items:center;align-content:center;gap:6px;min-height:150px;color:var(--ink)}
.wallets .card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;border-top:1px solid var(--line)}
.wallets .wi{width:42px;height:42px;border-radius:12px;font-size:1.3rem}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.strp{flex:none;min-width:165px;scroll-snap-align:start}
.tx[data-id]{touch-action:pan-y}
.priv main,.priv nav,.priv #fab{filter:blur(16px)}
body{zoom:var(--z,1)}
.tx.sel{outline:2px solid var(--acc)}
</style>
</head>
<body>
<main id="main"></main>
<button id="fab" onclick="toggleMenu()" aria-haspopup="true" aria-label="Add entry"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="menu" hidden><button onclick="openSheet(null,'expense')">+ Expense</button><button onclick="openSheet(null,'income')">+ Income</button><button onclick="openSheet(null,'transfer')">↔ Transfer</button><button onclick="openSheet(null,'saving')">🎯 Savings</button><button onclick="$('#rcp').click();$('#menu').hidden=true">📷 Scan receipt</button><button onclick="openAllowance()">🎁 Allowance or gift</button><button onclick="openSheet(null,'adjustment')">± Adjust balance</button></div>
<nav><div id="nav"></div></nav>
<div id="toast" hidden role="status"></div>
<input id="rcp" type="file" accept="image/*" capture="environment" hidden onchange="scanReceipt(this)">
<div id="sheet" hidden></div>
<div id="lock" hidden><div class="card" style="max-width:320px;width:100%"><h1>Peso Plan</h1><label>Enter your PIN<input id="lp" type="password" inputmode="numeric" maxlength="8"></label><div class="err" id="lerr2"></div><button class="primary" onclick="unlock()">Unlock</button></div></div>
<script>
const KEY='peso-plan-v1',MAX=100000000,COLORS=['#E3B93C','#C9C2AE','#B8860B','#8FBF9F','#7A7466'];
const CATS=[['Food','🍔'],['Transportation','🚌'],['Shopping','🛍️'],['Bills','🧾'],['Personal','🧴'],['Family','👪'],['Entertainment','🎬'],['Health','💊'],['Education','📚'],['Other','📦']];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
/* money: integer centavos only */
function parse(v){v=String(v).replace(/[,₱\s]/g,'');if(!/^\d+(\.\d{1,2})?$/.test(v)||v.length>12)return null;const[a,b='']=v.split('.');const c=parseInt(a,10)*100+parseInt((b+'00').slice(0,2),10);return c>MAX?null:c}
const fmt=c=>(c<0?'-':'')+'₱'+(Math.abs(c)/100).toLocaleString('en-PH',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const raw=c=>(c/100).toFixed(2).replace(/\.00$/,'');
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const dfmt=s=>new Date(s+'T00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
/* state */
const ICON_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
const SUGGEST=[['Groceries','🛒'],['Rent','🏠'],['Utilities','💡'],['Subscriptions','📺'],['Load and data','📶'],['Travel','✈️'],['Gifts','🎁'],['Pets','🐾'],['Insurance','🛡️'],['Fees and charges','🏦'],['Fitness','🏋️'],['Savings','🐷']];
SUGGEST.push(['Tax','🧮'],['SSS','🛡️'],['PhilHealth','🏥'],['Pag-IBIG','🏠']);
const sug=()=>SUGGEST.filter(([n])=>!S.cats.some(c=>c.n.toLowerCase()===n.toLowerCase()));
const PHOTO_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
const FREQ=['daily','weekly','biweekly','monthly','yearly'],NW=['need','want','save'];
function fresh(){return{v:2,assets:[],debts:[],owed:[],rules:[],pd:[],lowCash:0,sz:'n',round:{on:false,g:'',step:1000},targets:{need:50,want:30,save:20},user:'',hide:false,ready:false,theme:'dark',quick:[],budget:0,wallets:[{id:'cash',name:'Cash',start:0},{id:'gotyme',name:'GoTyme',start:0}],cats:CATS.map(([n,e])=>({n,e})),tx:[],goals:[],rec:[],limits:{d:0,w:0,m:0},pin:null}}
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))||fresh()}catch(e){return fresh()}}
/* validates and migrates v1/v2 data; returns null when unusable */
function norm(s){if(!s||typeof s!=='object'||!Array.isArray(s.wallets)||!Array.isArray(s.tx)||!Array.isArray(s.cats))return null;
 const ok=n=>Number.isInteger(n)&&n>=0&&n<=MAX*100,id=x=>typeof x==='string'&&/^[\w-]{1,40}$/.test(x),str=(x,n=200)=>typeof x==='string'?x.slice(0,n):'',dt=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)&&!isNaN(new Date(x));
 if(!ok(s.budget))return null;const d=fresh();d.budget=s.budget;
 d.wallets=s.wallets.filter(w=>w&&id(w.id)&&ok(w.start)).map(w=>({id:w.id,name:str(w.name,20)||'Wallet',start:w.start,color:/^#[0-9a-f]{6}$/i.test(w.color||'')?w.color:'',icon:ICON_RE.test(w.icon||'')&&w.icon.length<20000?w.icon:str(w.icon,8)}));
 if(!d.wallets.length)return null;
 const wid=x=>d.wallets.some(w=>w.id===x);
 d.cats=s.cats.filter(c=>c&&str(c.n)).map(c=>({n:str(c.n,20),e:ICON_RE.test(c.e)&&c.e.length<20000?c.e:str(c.e,8)||'📦',budget:ok(c.budget)?c.budget:0,hard:c.hard===true}));
 if(!d.cats.length)d.cats=fresh().cats;
 d.tx=s.tx.filter(t=>t&&id(t.id)&&Number.isInteger(t.amt)&&t.amt>0&&t.amt<=MAX*100&&wid(t.w)&&dt(t.date)).map(t=>{const ty=['expense','income','transfer','adjustment'].includes(t.type)?t.type:'expense';return{id:t.id,type:ty,name:str(t.name,60),amt:t.amt,cat:str(t.cat,20),w:t.w,to:ty==='transfer'&&wid(t.to)&&t.to!==t.w?t.to:'',sign:t.sign===-1?-1:1,nw:NW.includes(t.nw)?t.nw:'',g:id(t.g)?t.g:'',note:str(t.note),tags:Array.isArray(t.tags)?t.tags.filter(x=>typeof x==='string'&&/^[\w-]{1,20}$/.test(x)).slice(0,5):[],photo:typeof t.photo==='string'&&t.photo.length<260000&&PHOTO_RE.test(t.photo)?t.photo:'',d:id(t.d)?t.d:'',u:id(t.u)?t.u:'',date:t.date,at:Number.isInteger(t.at)?t.at:0}}).filter(t=>t.type!=='transfer'||t.to);
 d.goals=(s.goals||[]).filter(g=>g&&id(g.id)&&ok(g.target)&&g.target>0&&ok(g.base)).map(g=>({id:g.id,name:str(g.name,30)||'Goal',target:g.target,base:g.base,icon:ICON_RE.test(g.icon||'')&&g.icon.length<20000?g.icon:str(g.icon,8)||'🎯',due:dt(g.due)?g.due:'',start:dt(g.start)?g.start:today(),auto:ok(g.auto)?g.auto:0,aw:wid(g.aw)?g.aw:'',la:/^\d{4}-\d\d$/.test(g.la||'')?g.la:''}));
 d.rec=(s.rec||[]).filter(r=>r&&id(r.id)&&ok(r.amt)&&r.amt>0&&wid(r.w)&&FREQ.includes(r.freq)&&dt(r.next)).map(r=>({id:r.id,name:str(r.name,60),amt:r.amt,w:r.w,cat:str(r.cat,20),nw:NW.includes(r.nw)?r.nw:'',freq:r.freq,next:r.next,type:['income','allowance'].includes(r.type)?r.type:'expense',rem:[-1,0,1,3].includes(r.rem)?r.rem:-1}));

/* average color of an image's edge pixels (its background); falls back to the whole image */
function bgColor(img){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(img,0,0,32,32);const d=x.getImageData(0,0,32,32).data;
 const run=pts=>{let r=0,g=0,b=0,n=0;for(const[px,py]of pts){const o=(py*32+px)*4;if(d[o+3]<128)continue;r+=d[o];g+=d[o+1];b+=d[o+2];n++}return n?'#'+[r,g,b].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join(''):null};
 const edge=[],all=[];for(let i=0;i<32;i++){edge.push([i,0],[i,31],[0,i],[31,i]);for(let j=0;j<32;j++)all.push([i,j])}
 return run(edge)||run(all)}

async function encJSON(txt,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await aesKey(pw,salt),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));return JSON.stringify({enc:1,salt:b64(salt),iv:b64(iv),data:b64(c)})}
async function decJSON(o,pw){const k=await aesKey(pw,ub64(o.salt));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.data)))}
async function exportJSON(){const pw=($('#bpw')||{}).value||'';let txt=JSON.stringify({...S,pin:null},null,1);try{if(pw)txt=await encJSON(txt,pw)}catch(e){const ie=$('#ierr');if(ie)ie.textContent='Could not protect the backup.';return}
 const ok=await save('peso-plan-backup-'+today()+(pw?'-protected':'')+'.json',txt,'application/json');if(ok){S.lastBackup=today();persist()}}
async function unlockBackup(){try{const d=norm(JSON.parse(await decJSON(ui.encObj,$('#ipw').value)));if(!d)throw 0;ui.imp=d;$('#iok').innerHTML=`<div class="banner bad">This backup has ${d.tx.length} transactions. Restoring replaces everything on this device.</div><button class="danger" onclick="applyImport()">Replace my data</button>`}catch(e){$('#ierr').textContent='Wrong password or damaged file.'}}
function exportCSV(){const q=v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const rows=[['Date','Type','Title','Category','Wallet','To wallet','Amount (PHP)','Need or want','Note'].map(q).join(',')];
 sorted().forEach(t=>rows.push([q(t.date),q(t.type),q(t.name),q(t.cat),q(W(t.w).name),q(t.to?W(t.to).name:''),(t.type==='expense'||(t.type==='adjustment'&&t.sign<0)?'-':'')+(Math.floor(t.amt/100))+'.'+String(t.amt%100).padStart(2,'0'),q(t.nw),q(t.note)].join(',')));
 save('peso-plan-transactions.csv',rows.join('\n'),'text/csv')}
function importFile(inp){const f=inp.files[0],e=$('#ierr');e.textContent='';$('#iok').innerHTML='';if(!f)return;
 if(f.size>5e6)return e.textContent='That file is too large to be a backup.';
 const r=new FileReader();r.onload=()=>{let d=null;try{const o=JSON.parse(r.result);if(o&&o.enc===1&&o.salt&&o.iv&&o.data){ui.encObj=o;$('#iok').innerHTML='<label>This backup is protected. Enter its password<input id="ipw" type="password"></label><button class="primary" onclick="unlockBackup()">Unlock backup</button>';return}d=norm(o)}catch(x){}
  if(!d)return e.textContent='This is not a valid Peso Plan backup. Nothing was changed.';
  ui.imp=d;$('#iok').innerHTML=`<div class="banner bad">This backup has ${d.tx.length} transactions and a ${fmt(d.budget)} budget. Restoring replaces everything on this device. Export a backup first if you want to keep your current data.</div><button class="danger" onclick="applyImport()">Replace my data</button>`};r.readAsText(f)}
function applyImport(){if(!ui.imp)return;ui.imp.pin=S.pin;S=ui.imp;ui.imp=null;persist();ui.tab='home';render()}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPin(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(h=>parseInt(h,16))),iterations:200000,hash:'SHA-256'},k,256))}
async function setPin(){const p=$('#pn').value;if(!/^\d{4,8}$/.test(p))return $('#perr').textContent='Use 4 to 8 digits.';const salt=hex(crypto.getRandomValues(new Uint8Array(16)));S.pin={salt,hash:await hashPin(p,salt)};persist();render()}
function clearPin(){S.pin=null;persist();render()}
async function unlock(){const e=$('#lerr2');if(Date.now()<(ui.until||0))return e.textContent='Too many tries. Wait 30 seconds.';
 if(await hashPin($('#lp').value,S.pin.salt)===S.pin.hash){ui.tries=0;$('#lp').value='';e.textContent='';$('#lock').hidden=true}else{ui.tries=(ui.tries||0)+1;if(ui.tries>=5){ui.until=Date.now()+30000;ui.tries=0}e.textContent='Wrong PIN.'}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.pin)$('#lock').hidden=false});
runAuto();notifyDue();
if(window.indexedDB)idbGet().then(v=>{if(!v){idbPut(JSON.stringify(S)).catch(()=>{});return}const d=norm(JSON.parse(v));if(d&&(d.sv||0)>(S.sv||0)){S=d;render()}}).catch(()=>{});
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('priv',document.hidden));
{const a=new URLSearchParams(location.search).get('add');if(S.ready&&(a==='expense'||a==='income'))setTimeout(()=>openSheet(null,a),300)}
(()=>{const f=$('#fab');let tm=null,lp=false;f.addEventListener('pointerdown',()=>{lp=false;tm=setTimeout(()=>{lp=true;longMenu()},500)});
 ['pointerup','pointerleave','pointercancel'].forEach(e=>f.addEventListener(e,()=>clearTimeout(tm)));
 f.addEventListener('click',e=>{if(lp){e.preventDefault();e.stopImmediatePropagation();lp=false}},true)})();
let sw=null;document.addEventListener('touchstart',e=>{const r=e.target.closest&&e.target.closest('.tx[data-id]');sw=r?{r,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0}:null},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(Math.abs(dy)>Math.abs(dx)){sw=null;return}sw.dx=dx;sw.r.style.transform='translateX('+Math.max(-110,Math.min(110,dx))+'px)'},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const{r,dx}=sw;r.style.transform='';sw=null;if(dx<-90)swipeDel(r.dataset.id);else if(dx>90)openSheet(r.dataset.id)});
if(S.pin)$('#lock').hidden=false;
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
{const a=new URLSearchParams(location.search).get('add');if(['expense','income','transfer'].includes(a)&&S.ready)setTimeout(()=>openSheet(null,a),50)}
</script>
</body>
